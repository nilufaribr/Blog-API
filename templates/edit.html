<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Post — BlogAPI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
  <a href="/" class="nav-brand">✏️ BlogAPI</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container" style="max-width: 680px;">
  <h1 class="page-title">✏️ Edit Post</h1>

  <div class="card">
    <div id="loading" class="loading">Loading post...</div>
    <div id="error" class="empty-msg" style="display:none;"></div>

    <div id="editForm" style="display:none;">
      <div class="alert alert-error" id="editError" style="display:none;"></div>
      <div class="alert alert-success" id="editSuccess" style="display:none;"></div>

      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="title" placeholder="Enter title...">
      </div>

      <div class="form-group">
        <label>Content *</label>
        <textarea id="content" style="min-height:200px;" placeholder="Edit your content..."></textarea>
      </div>

      <div class="form-group">
        <label>Category <span style="color:#aaa; font-weight:400;">(optional)</span></label>
        <select id="category">
          <option value="">No category</option>
        </select>
      </div>

      <div class="form-group">
        <label>Cover Image <span style="color:#aaa; font-weight:400;">(optional)</span></label>
        <input type="file" id="image" accept="image/*">
        <small style="color:#999; margin-top:5px;">Leave empty to keep current image</small>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-primary" onclick="doUpdate()">💾 Save Changes</button>
        <a href="/" class="btn btn-outline">Cancel</a>
      </div>
    </div>
  </div>
</div>

<script src="/static/utils.js"></script>
<script>
  requireLogin();

  const postId = new URLSearchParams(window.location.search).get('id');

  async function loadPost() {
    if (!postId) {
      document.getElementById('error').textContent = '❌ No post ID provided.';
      document.getElementById('error').style.display = 'block';
      document.getElementById('loading').style.display = 'none';
      return;
    }

    const result = await apiCall(`/posts/${postId}/`);

    if (result.success) {
      const post = result.data;

      // Check if user is author
      if (getUsername() !== post.author) {
        document.getElementById('error').textContent = '❌ You can only edit your own posts.';
        document.getElementById('error').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        return;
      }

      // Fill form
      document.getElementById('title').value = post.title;
      document.getElementById('content').value = post.content;
      if (post.category) {
        document.getElementById('category').value = post.category;
      }

      loadCategories();
      document.getElementById('editForm').style.display = 'block';
    } else {
      document.getElementById('error').textContent = '❌ ' + result.error;
      document.getElementById('error').style.display = 'block';
    }

    document.getElementById('loading').style.display = 'none';
  }

  async function loadCategories() {
    const result = await apiCall('/posts/');
    
    if (result.success && result.data && result.data.length > 0) {
      const posts = Array.isArray(result.data) ? result.data : (result.data.results || []);
      const categories = [...new Set(
        posts
          .filter(p => p.category)
          .map(p => JSON.stringify({ id: p.category, name: p.category_name }))
      )].map(s => JSON.parse(s));

      const select = document.getElementById('category');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
    }
  }

  async function doUpdate() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const category = document.getElementById('category').value;
    const imageFile = document.getElementById('image').files[0];

    hideAlert('editError');
    hideAlert('editSuccess');

    if (!title) {
      showAlert('editError', '⚠️ Title is required.', 'error');
      return;
    }
    if (!content) {
      showAlert('editError', '⚠️ Content is required.', 'error');
      return;
    }

    try {
      let result;

      if (imageFile) {
        // Use FormData for file upload
        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);
        if (category) formData.append('category', category);
        formData.append('image', imageFile);

        result = await apiCallFormData(`/posts/${postId}/`, formData, 'PATCH');
      } else {
        // Use JSON without image
        const body = { title, content };
        if (category) body.category = parseInt(category);

        result = await apiCall(`/posts/${postId}/`, 'PATCH', body);
      }

      if (result.success) {
        showAlert('editSuccess', '✅ Post updated!', 'success');
        setTimeout(() => {
          window.location.href = `/post/?id=${postId}`;
        }, 800);
      } else {
        showAlert('editError', '❌ ' + result.error, 'error');
      }
    } catch (e) {
      showAlert('editError', '❌ Error updating post.', 'error');
    }
  }

  // Load on page load
  loadPost();
</script>
</body>
</html>
