<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — BlogAPI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
  <a href="/" class="nav-brand">✏️ BlogAPI</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container" style="max-width: 680px;">
  <h1 class="page-title">👤 Your Profile</h1>

  <div class="card">
    <div id="loading" class="loading">Loading profile...</div>
    <div id="error" class="empty-msg" style="display:none;"></div>

    <div id="profileForm" style="display:none;">
      <div class="alert alert-error" id="profileError" style="display:none;"></div>
      <div class="alert alert-success" id="profileSuccess" style="display:none;"></div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" disabled style="background:#f5f5f5; cursor:not-allowed;">
        <small style="color:#999;">Username cannot be changed</small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="first_name" placeholder="Your first name (optional)">
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="last_name" placeholder="Your last name (optional)">
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-primary" onclick="doUpdate()">💾 Save Changes</button>
        <a href="/" class="btn btn-outline">Back to Posts</a>
      </div>

      <hr style="margin: 30px 0;">

      <h3>Your Posts</h3>
      <div id="userPosts"></div>
    </div>
  </div>
</div>

<script src="/static/utils.js"></script>
<script>
  requireLogin();

  async function loadProfile() {
    const result = await apiCall('/auth/profile/');

    if (result.success) {
      const user = result.data;
      
      document.getElementById('username').value = user.username || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('first_name').value = user.first_name || '';
      document.getElementById('last_name').value = user.last_name || '';

      document.getElementById('profileForm').style.display = 'block';

      // Load user's posts
      loadUserPosts(user.username);
    } else {
      document.getElementById('error').textContent = '❌ ' + result.error;
      document.getElementById('error').style.display = 'block';
    }

    document.getElementById('loading').style.display = 'none';
  }

  async function loadUserPosts(username) {
    const result = await apiCall('/posts/');

    if (result.success) {
      const posts = Array.isArray(result.data) ? result.data : (result.data.results || []);
      const userPosts = posts.filter(p => p.author === username);

      if (!userPosts.length) {
        document.getElementById('userPosts').innerHTML = '<p style="color:#999;">You haven\'t posted anything yet. <a href="/create/">Create your first post!</a></p>';
        return;
      }

      document.getElementById('userPosts').innerHTML = userPosts.map(p => `
        <div style="padding:15px; border:1px solid #eee; border-radius:4px; margin-bottom:10px;">
          <div style="font-weight:700; margin-bottom:5px;">
            <a href="/post/?id=${p.id}" style="text-decoration:none; color:#333;">
              ${escapeHtml(p.title)}
            </a>
          </div>
          <div style="color:#666; font-size:12px; margin-bottom:10px;">
            📅 ${new Date(p.created_at).toLocaleDateString()} • 
            ❤️ ${p.likes_count} likes • 
            💬 ${p.comments_count} comments
          </div>
          <div style="margin-bottom:10px;">${escapeHtml((p.content || '').slice(0, 100))}...</div>
          <div>
            <a href="/edit/?id=${p.id}" class="btn btn-outline btn-sm">Edit</a>
            <button onclick="deletePost(${p.id})" class="btn btn-danger btn-sm" style="background:#dc3545;">Delete</button>
          </div>
        </div>
      `).join('');
    }
  }

  async function doUpdate() {
    const email = document.getElementById('email').value.trim();
    const first_name = document.getElementById('first_name').value.trim();
    const last_name = document.getElementById('last_name').value.trim();

    hideAlert('profileError');
    hideAlert('profileSuccess');

    if (!email) {
      showAlert('profileError', '⚠️ Email is required.', 'error');
      return;
    }

    const result = await apiCall('/auth/profile/', 'PATCH', {
      email,
      first_name,
      last_name
    });

    if (result.success) {
      showAlert('profileSuccess', '✅ Profile updated!', 'success');
      localStorage.setItem('blog_username', result.data.username);
      buildNav(); // Update nav
    } else {
      showAlert('profileError', '❌ ' + result.error, 'error');
    }
  }

  async function deletePost(postId) {
    if (!confirm('Delete this post? This cannot be undone.')) return;

    const result = await apiCall(`/posts/${postId}/`, 'DELETE');

    if (result.success) {
      alert('✅ Post deleted');
      loadProfile(); // Reload to update post list
    } else {
      alert('❌ ' + result.error);
    }
  }

  function escapeHtml(text) {
    if (!text) return '';
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  // Load on page load
  loadProfile();
</script>
</body>
</html>
