<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post — BlogAPI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
  <a href="/" class="nav-brand">✏️ BlogAPI</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container" style="max-width: 680px;">
  <h1 class="page-title">✍️ Create New Post</h1>

  <div class="card">
    <div class="alert alert-error" id="createError" style="display:none;"></div>
    <div class="alert alert-success" id="createSuccess" style="display:none;"></div>

    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="title" placeholder="Enter a catchy title...">
    </div>

    <div class="form-group">
      <label>Content *</label>
      <textarea id="content" style="min-height:200px;" placeholder="Write your post content here..."></textarea>
    </div>

    <div class="form-group">
      <label>Category <span style="color:#aaa; font-weight:400;">(optional)</span></label>
      <select id="category">
        <option value="">No category</option>
      </select>
    </div>

    <div class="form-group">
      <label>Cover Image <span style="color:#aaa; font-weight:400;">(optional)</span></label>
      <input type="file" id="image" accept="image/*">
      <small style="color:#999; margin-top:5px;">Max size: 5MB</small>
    </div>

    <div style="display:flex; gap:10px; margin-top:8px;">
      <button class="btn btn-primary" onclick="doCreate()">🚀 Publish Post</button>
      <a href="/" class="btn btn-outline">Cancel</a>
    </div>
  </div>
</div>

<script src="/static/utils.js"></script>
<script>
  requireLogin();

  async function loadCategories() {
    const result = await apiCall('/posts/');
    
    if (result.success && result.data && result.data.length > 0) {
      const posts = Array.isArray(result.data) ? result.data : (result.data.results || []);
      const categories = [...new Set(
        posts
          .filter(p => p.category)
          .map(p => JSON.stringify({ id: p.category, name: p.category_name }))
      )].map(s => JSON.parse(s));

      const select = document.getElementById('category');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
    }
  }

  async function doCreate() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const category = document.getElementById('category').value;
    const imageFile = document.getElementById('image').files[0];

    hideAlert('createError');
    hideAlert('createSuccess');

    // Validation
    if (!title) {
      showAlert('createError', '⚠️ Title is required.', 'error');
      return;
    }
    if (!content) {
      showAlert('createError', '⚠️ Content is required.', 'error');
      return;
    }

    try {
      let result;

      if (imageFile) {
        // Use FormData for file upload
        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);
        if (category) formData.append('category', category);
        formData.append('image', imageFile);

        result = await apiCallFormData('/posts/', formData, 'POST');
      } else {
        // Use JSON without image
        const body = { title, content };
        if (category) body.category = parseInt(category);

        result = await apiCall('/posts/', 'POST', body);
      }

      if (result.success) {
        showAlert('createSuccess', '✅ Post published successfully!', 'success');
        setTimeout(() => {
          window.location.href = `/post/?id=${result.data.id}`;
        }, 800);
      } else {
        showAlert('createError', '❌ ' + result.error, 'error');
      }
    } catch (e) {
      showAlert('createError', '❌ Error creating post.', 'error');
    }
  }

  // Load categories on page load
  document.addEventListener('DOMContentLoaded', loadCategories);
</script>
</body>
</html>
